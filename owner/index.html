<!-- AUTH -->
<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><img class="auth-logo" src="../assets/img/logo-full.png" alt="Lopez Cuts" width="641" height="435"><span class="auth-tag">Owner</span></div>
    <div id="authBody"></div>
  </div>
  <p class="auth-foot"><svg class="ic"><use href="#i-lock"/></svg>Private. Invited team members only. <a href="../">Back to the public site</a></p>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-brand"><img class="side-logo" src="../assets/img/logo-mark.png" alt="" width="149" height="200"><span class="side-word">Lopez Cuts</span></div>
    <nav class="side-nav" id="sideNav" aria-label="Sections"></nav>
    <div class="side-me" id="sideMe"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-left">
        <h1 id="viewTitle">Today</h1>
        <span class="top-date" id="topDate"></span>
      </div>
      <div class="top-right">
        <label class="search" for="globalSearch"><svg class="ic"><use href="#i-search"/></svg><input id="globalSearch" type="search" placeholder="Find a client" autocomplete="off"></label>
        <button class="btn gold" type="button" id="newBooking"><svg class="ic"><use href="#i-plus"/></svg><span>New booking</span></button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<dialog class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" type="button" id="modalClose" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div><div class="modal-body" id="modalBody"></div></div></dialog>
<dialog class="drawer" id="drawer"><div class="drawer-card"><div class="modal-head"><h2 id="drawerTitle"></h2><button class="icon-btn" type="button" id="drawerClose" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div><div class="drawer-body" id="drawerBody"></div></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/owner.js"></script>
</body>
</html>
